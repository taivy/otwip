name: Neocities sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, off the busy top of the hour
  workflow_dispatch:          # "Run workflow" button for an instant sync

concurrency:
  group: neocities-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Sync with Neocities
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: python scripts/neocities_sync.py

      - name: Commit sync results
        run: |
          git config user.name "neocities-sync[bot]"
          git config user.email "neocities-sync@users.noreply.github.com"
          git add -A site .neocities-state.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          # Files under site/ changed only if something came down from Neocities.
          # A state-only change means the repo's files were uploaded to Neocities.
          if git diff --cached --quiet -- site; then
            msg="Sync to Neocities (record uploaded files)"
          else
            msg="Sync from Neocities"
          fi
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
